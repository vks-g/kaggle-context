[project]
name = "kctx"
version = "0.2.0"
description = "Turn any Kaggle competition into Claude-ready context: a workspace folder, a Claude skill, or a local MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vks-g" }]
requires-python = ">=3.11"
keywords = ["kaggle", "claude", "llm", "mcp", "context", "cli", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "kaggle>=2.2.4",
    "markdownify>=1.2",
    "mcp>=2.2",
    "questionary>=2.1",
    "typer>=0.27",
]

[project.urls]
Homepage = "https://github.com/vks-g/kctx"
Issues = "https://github.com/vks-g/kctx/issues"

[project.scripts]
kctx = "kctx.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kctx"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter wraps code; long strings stay readable. B008: typer idiom.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
timeout = 60  # interactive tests must never hang CI
